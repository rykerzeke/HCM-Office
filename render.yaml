services:
  - type: web
    name: hcm-portal-backend
    runtime: node
    region: singapore   # Change to your preferred region: oregon, ohio, frankfurt, singapore
    plan: free
    rootDir: minister-portal/backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npx ts-node src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false       # You will set this manually in the Render dashboard
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: ENCRYPTION_KEY
        sync: false       # Set manually — must be a 64-char hex string
      - key: CORS_ORIGIN
        sync: false       # Set to your Vercel frontend URL, e.g. https://hcm-portal.vercel.app
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1           # Persistent disk for uploaded files
