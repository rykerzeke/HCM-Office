services:
  - type: web
    name: hcm-office
    runtime: node
    region: singapore   # Change to your preferred region: oregon, ohio, frankfurt, singapore
    plan: free
    rootDir: minister-portal/backend
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false       # You will set this manually in the Render dashboard
      - key: JWT_SECRET
        generateValue: true   # Render auto-generates a secure random value
      - key: ENCRYPTION_KEY
        sync: false       # Set manually — must be EXACTLY a 64-char hex string (32 bytes for AES-256)
      - key: CORS_ORIGIN
        sync: false       # REQUIRED: Set to your Vercel frontend URL, e.g. https://hcm-portal.vercel.app
      - key: UPLOADS_DIR
        value: /var/data/uploads  # Must match disk mountPath below
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1           # Persistent disk for uploaded files
